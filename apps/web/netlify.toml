# Package directory do site na Netlify = apps/web (definido na UI; não dá para setar aqui).
# O runtime do Next.js (@netlify/plugin-nextjs) é instalado automaticamente: não fixar versão.
# Variáveis de runtime (DATABASE_URL, PIX_KEY_ENCRYPTION_KEY, APP_BASE_URL, DATABASE_SSL) ficam
# na UI/CLI, nunca neste arquivo: o netlify.toml não chega às funções em runtime e vai para o repo.
#
# Os caminhos abaixo são relativos à RAIZ do repositório (a Netlify resolve assim num monorepo:
# o log mostrou publish ".next" virando /opt/build/repo/.next).

[build]
  command = "pnpm --filter @linkq/web build"
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "22.23.4"
